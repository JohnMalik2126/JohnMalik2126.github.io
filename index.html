<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Invitations Bot</title>
  <style>
    body { font-family: Inter, Arial, sans-serif; line-height: 1.6; color: #222; max-width: 760px; margin: 0 auto; padding: 24px; background: #f5f7fb; }
    .box { background: #fff; padding: 24px; border-radius: 12px; box-shadow: 0 4px 14px rgba(0,0,0,0.08); }
    h1 { margin-top: 0; }
    code { background: #eef2ff; padding: 2px 6px; border-radius: 6px; }
  </style>
</head>
<body>
  <main class="box">
    <h1>Invitations & Greeting Cards Bot</h1>
    <p>This service powers a Telegram bot that creates wedding invitations, greeting cards, and love letters with shareable web links.</p>
    <p>Use Telegram to create a card, then open your generated link in this format:</p>
    <p><code>/invite/&lt;token&gt;</code></p>
    <p>Health check endpoint: <code>/health</code></p>
  </main>
</body>
</html>
